<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Made by cf:walkthrough</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); }
    main { box-sizing: border-box; height: 85vh; display: flex; flex-direction: column; justify-content: center; padding: 0 160px; }
    h1 { font-family: var(--font-serif); font-weight: 500; font-size: 84px; margin: 0 0 var(--space-3); }
    ul { list-style: none; margin: 0; padding: 0; max-width: 1400px; }
    li { display: grid; grid-template-columns: 420px 1fr; gap: var(--space-2); padding: var(--space-2) 0; border-top: 1px solid var(--border); font-size: 34px; }
    li:last-child { border-bottom: 1px solid var(--border); }
    code { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
    span { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>This clip is made by <code>cf:walkthrough</code></h1>
    <ul>
      <li><code>storyboard.json</code><span>scenes, narration, timing</span></li>
      <li><code>kind: "diagram"</code><span>the change flow you just watched</span></li>
      <li><code>.cache/</code><span>voice, frames, captions, keyed by content</span></li>
    </ul>
  </main>
</body>
</html>
