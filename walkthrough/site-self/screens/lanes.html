<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Every enabled lane runs</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="lanes.css">
  <style>
    main { padding-top: 90px; }
    .stage { position: relative; width: 1640px; height: 700px; }
    svg { position: absolute; inset: 0; overflow: visible; }
    path { fill: none; stroke: var(--c); stroke-width: 4; opacity: .55; }
    path.out { opacity: .2; animation: lit 400ms ease-out var(--t) both; }
    @keyframes lit { to { opacity: .8; } }
    .box { position: absolute; height: 96px; display: flex; align-items: center; justify-content: center; gap: 14px; box-sizing: border-box; border-radius: 16px; font-size: 32px; font-weight: 600; background: var(--surface); border: 3px solid var(--border); }
    .pr { left: 0; top: 302px; width: 270px; border-color: var(--text); }
    .report { left: 1370px; top: 302px; width: 270px; border-color: var(--accent); animation: pop 300ms ease-out 900ms both, glow 600ms ease-in-out 7600ms both; }
    @keyframes glow { to { box-shadow: 0 0 0 10px color-mix(in srgb, var(--lilac) 30%, transparent); } }
    .lane { position: absolute; left: 630px; width: 380px; height: 96px; display: flex; align-items: center; gap: 16px; padding: 0 24px; box-sizing: border-box; border-radius: 16px; font-size: 30px; font-weight: 600; background: var(--surface); border: 3px solid var(--c); animation: pop 300ms ease-out var(--d) both, hot 500ms ease-out var(--t) both; }
    .lane i { width: 26px; height: 26px; border-radius: 50%; background: var(--c); flex: none; }
    @keyframes hot { from { background: var(--surface); } to { background: color-mix(in srgb, var(--c) 22%, var(--bg)); } }
    .fdot { position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 30%, transparent), 0 0 18px var(--c); offset-anchor: center; offset-rotate: 0deg; opacity: 0; animation: travel 1000ms ease-in-out both; }
    @keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
  </style>
</head>
<body>
  <main>
    <div class="stage">
      <svg viewBox="0 0 1640 700" width="1640" height="700"><path class="load" d="M 270 350 C 450 350, 450 70, 630 70"/><path class="load out" style="--t:1700ms" d="M 1010 70 C 1190 70, 1190 350, 1370 350"/><path class="a11y" d="M 270 350 C 450 350, 450 210, 630 210"/><path class="a11y out" style="--t:2600ms" d="M 1010 210 C 1190 210, 1190 350, 1370 350"/><path class="zap" d="M 270 350 C 450 350, 450 350, 630 350"/><path class="zap out" style="--t:3800ms" d="M 1010 350 C 1190 350, 1190 350, 1370 350"/><path class="ux" d="M 270 350 C 450 350, 450 490, 630 490"/><path class="ux out" style="--t:5200ms" d="M 1010 490 C 1190 490, 1190 350, 1370 350"/><path class="cases" d="M 270 350 C 450 350, 450 630, 630 630"/><path class="cases out" style="--t:6700ms" d="M 1010 630 C 1190 630, 1190 350, 1370 350"/></svg>
      <div class="box pr">Pull request</div>
      <div class="lane load" style="top:22px; --d:300ms; --t:1700ms"><i></i>Load (k6)</div>
      <div class="lane a11y" style="top:162px; --d:420ms; --t:2600ms"><i></i>Accessibility (axe)</div>
      <div class="lane zap" style="top:302px; --d:540ms; --t:3800ms"><i></i>Security (ZAP)</div>
      <div class="lane ux" style="top:442px; --d:660ms; --t:5200ms"><i></i>Responsive UX</div>
      <div class="lane cases" style="top:582px; --d:780ms; --t:6700ms"><i></i>Test cases</div>
      <div class="box report">One report</div>
      <span class="fdot load" style="offset-path: path('M 270 350 C 450 350, 450 70, 630 70'); animation-delay: 300ms"></span>
      <span class="fdot load" style="offset-path: path('M 270 350 C 450 350, 450 70, 630 70'); animation-delay: 550ms"></span>
      <span class="fdot load" style="offset-path: path('M 1010 70 C 1190 70, 1190 350, 1370 350'); animation-delay: 1700ms"></span>
      <span class="fdot load" style="offset-path: path('M 1010 70 C 1190 70, 1190 350, 1370 350'); animation-delay: 1920ms"></span>
      <span class="fdot load" style="offset-path: path('M 1010 70 C 1190 70, 1190 350, 1370 350'); animation-delay: 2140ms"></span>
      <span class="fdot a11y" style="offset-path: path('M 270 350 C 450 350, 450 210, 630 210'); animation-delay: 420ms"></span>
      <span class="fdot a11y" style="offset-path: path('M 270 350 C 450 350, 450 210, 630 210'); animation-delay: 670ms"></span>
      <span class="fdot a11y" style="offset-path: path('M 1010 210 C 1190 210, 1190 350, 1370 350'); animation-delay: 2600ms"></span>
      <span class="fdot a11y" style="offset-path: path('M 1010 210 C 1190 210, 1190 350, 1370 350'); animation-delay: 2820ms"></span>
      <span class="fdot a11y" style="offset-path: path('M 1010 210 C 1190 210, 1190 350, 1370 350'); animation-delay: 3040ms"></span>
      <span class="fdot zap" style="offset-path: path('M 270 350 C 450 350, 450 350, 630 350'); animation-delay: 540ms"></span>
      <span class="fdot zap" style="offset-path: path('M 270 350 C 450 350, 450 350, 630 350'); animation-delay: 790ms"></span>
      <span class="fdot zap" style="offset-path: path('M 1010 350 C 1190 350, 1190 350, 1370 350'); animation-delay: 3800ms"></span>
      <span class="fdot zap" style="offset-path: path('M 1010 350 C 1190 350, 1190 350, 1370 350'); animation-delay: 4020ms"></span>
      <span class="fdot zap" style="offset-path: path('M 1010 350 C 1190 350, 1190 350, 1370 350'); animation-delay: 4240ms"></span>
      <span class="fdot ux" style="offset-path: path('M 270 350 C 450 350, 450 490, 630 490'); animation-delay: 660ms"></span>
      <span class="fdot ux" style="offset-path: path('M 270 350 C 450 350, 450 490, 630 490'); animation-delay: 910ms"></span>
      <span class="fdot ux" style="offset-path: path('M 1010 490 C 1190 490, 1190 350, 1370 350'); animation-delay: 5200ms"></span>
      <span class="fdot ux" style="offset-path: path('M 1010 490 C 1190 490, 1190 350, 1370 350'); animation-delay: 5420ms"></span>
      <span class="fdot ux" style="offset-path: path('M 1010 490 C 1190 490, 1190 350, 1370 350'); animation-delay: 5640ms"></span>
      <span class="fdot cases" style="offset-path: path('M 270 350 C 450 350, 450 630, 630 630'); animation-delay: 780ms"></span>
      <span class="fdot cases" style="offset-path: path('M 270 350 C 450 350, 450 630, 630 630'); animation-delay: 1030ms"></span>
      <span class="fdot cases" style="offset-path: path('M 1010 630 C 1190 630, 1190 350, 1370 350'); animation-delay: 6700ms"></span>
      <span class="fdot cases" style="offset-path: path('M 1010 630 C 1190 630, 1190 350, 1370 350'); animation-delay: 6920ms"></span>

    </div>
  </main>
