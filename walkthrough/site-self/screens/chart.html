<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Findings per lane</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="lanes.css">
  <style>
    .ic { width: 1.1em; height: 1.1em; flex: none; vertical-align: -0.18em; }
    .lbl .ic { color: var(--c); }
    @property --n { syntax: "<integer>"; inherits: true; initial-value: 0; }
    .wrap { display: grid; grid-template-columns: 1fr 360px; gap: 80px; align-items: end; }
    .chart { display: flex; gap: 56px; align-items: flex-end; height: 560px; border-bottom: 3px solid var(--border); padding: 0 20px; }
    .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative;
      --n: var(--n0); animation: drain calc(var(--n0) * 120ms) steps(var(--n0)) var(--z) both; }
    @keyframes drain { from { --n: var(--n0); } to { --n: 0; } }
    .bar { width: 100%; height: calc(var(--n) * 60px); min-height: 6px; background: var(--c); border-radius: 10px 10px 0 0; transition: none; animation: rise 600ms ease-out var(--g) both; transform-origin: bottom; }
    @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .num { counter-reset: n var(--n); font-size: 44px; font-weight: 700; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
    .num::after { content: counter(n); }
    .lbl { position: absolute; bottom: -56px; font-size: 26px; color: var(--muted); white-space: nowrap; }
    .gate { position: relative; height: 140px; border-radius: 20px; border: 4px solid var(--border); font-size: 40px; font-weight: 700; display: grid; place-items: center; margin-bottom: 200px; animation: turn 300ms ease-out 3700ms both; }
    .gate span { grid-area: 1 / 1; }
    .wait { color: var(--muted); animation: out 200ms linear 3700ms both; }
    .pass { color: var(--btn-text); opacity: 0; animation: fadein 300ms ease-out 3800ms both; }
    @keyframes out { to { opacity: 0; } }
    @keyframes turn { to { background: var(--pass); border-color: var(--pass); } }
  </style>
</head>
<body>
  <main>
    <span class="note">Illustrative example, not real data</span>

        <div class="col ux" style="--n0:4; --z:2350ms; --g:300ms"><span class="num"></span><div class="bar"></div><span class="lbl"><!-- Phosphor devices, bold, @phosphor-icons/core 2.1.1 (MIT) --><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,72H212V64a28,28,0,0,0-28-28H40A28,28,0,0,0,12,64v88a28,28,0,0,0,28,28h96v12a28,28,0,0,0,28,28h60a28,28,0,0,0,28-28V100A28,28,0,0,0,224,72ZM40,156a4,4,0,0,1-4-4V64a4,4,0,0,1,4-4H184a4,4,0,0,1,4,4v8H164a28,28,0,0,0-28,28v56Zm188,36a4,4,0,0,1-4,4H164a4,4,0,0,1-4-4V100a4,4,0,0,1,4-4h60a4,4,0,0,1,4,4ZM124,208a12,12,0,0,1-12,12H88a12,12,0,0,1,0-24h24A12,12,0,0,1,124,208Zm88-84a12,12,0,0,1-12,12H188a12,12,0,0,1,0-24h12A12,12,0,0,1,212,124Z"/></svg> Responsive UX</span></div>

      </div>
      <div class="gate"><span class="wait">Gate: waiting</span><span class="pass">Gate: pass</span></div>
    </div>
  </main>
</body>
</html>
