<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Start building</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="journey.css">
  <style>
    main { gap: 56px; }
    .steps { display: grid; grid-template-columns: 800px 1fr 1fr; gap: 40px; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 32px; }
    .head { display: flex; align-items: center; gap: 24px; font-size: 48px; font-weight: 600; margin: 0; }
    .head .ico { --s: 112px; color: var(--accent); }
    .term { background: var(--code-bg); border: 1px solid var(--border); border-radius: 16px; padding: 28px 32px; }
    .term p { font-family: var(--font-mono); font-size: 40px; line-height: 1.6; margin: 0; white-space: pre; }
    .term .p { color: var(--muted); }
    .t1 { animation: show 100ms linear 400ms both; }
    .t2 { animation: show 100ms linear 1100ms both; }
    .t3 { animation: show 100ms linear 1800ms both; }
    .say { font-size: 44px; line-height: 1.3; margin: 0; }
    .rubric { align-self: flex-start; font-family: var(--font-mono); font-size: 40px; font-weight: 600; color: var(--btn-text); background: var(--accent); border-radius: 8px; padding: 8px 20px; margin: 0; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Start building</p>
    <div class="steps">
      <div class="col">
        <p class="head"><span class="ico" style="--src:url(assets/icons/phosphor-terminal-regular.svg)" aria-hidden="true"></span>Install</p>
        <div class="term">
          <p class="t1"><span class="p">$ </span>brew tap change-fabric/cf</p>
          <p class="t2"><span class="p">$ </span>brew install change-fabric</p>
          <p class="t3"><span class="p">$ </span>change-fabric-install</p>
        </div>
      </div>
      <div class="col in" style="--d:3200ms">
        <p class="head"><span class="ico" style="--src:url(assets/icons/phosphor-robot-regular.svg)" aria-hidden="true"></span>Ask</p>
        <p class="say in" style="--d:4200ms">Tidy up this long function.</p>
      </div>
      <div class="col in" style="--d:6000ms">
        <p class="head"><span class="ico" style="--src:url(assets/icons/phosphor-seal-check-regular.svg)" aria-hidden="true"></span>Rubric</p>
        <p class="rubric">cf:refactoring</p>
      </div>
    </div>
  </main>
</body>
</html>
