name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Stacked platform branches target their parent, not main, so a phase PR
    # would otherwise run no checks at all until the whole stack landed.
    branches: [main, "platform/**"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bundle exec rubocop
      - name: TypeScript smoke test
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: rake test
        if: ${{ !cancelled() }}
        run: bundle exec rake test
      - name: site build
        if: ${{ !cancelled() }}
        working-directory: site
        run: |
          npm ci
          npm run build

  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          # The Lambda runtime is nodejs22.x, so CI builds and tests on the
          # version the artifact actually runs on rather than the newest one.
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/api/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: vitest
        if: ${{ !cancelled() }}
        run: npm test
      - name: migrations match the schema
        if: ${{ !cancelled() }}
        run: npx drizzle-kit check
      - name: lambda bundle builds
        if: ${{ !cancelled() }}
        run: npm run build
