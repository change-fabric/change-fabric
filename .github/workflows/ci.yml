name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Every stacked PR must run checks, regardless of its parent branch.

# Nothing here writes to the repository or publishes anything.
permissions:
  contents: read

jobs:
  ci:
    # The required status check. It passes only when every test shard passed,
    # the shards together ran every test/*_test.rb file exactly once with at
    # least the expected number of runs, and the checks job passed.
    if: ${{ !cancelled() }}
    needs: [checks, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: checks and every shard passed
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.test.result }}
        run: |
          echo "checks: $CHECKS, test shards: $TESTS"
          test "$CHECKS" = success && test "$TESTS" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: test-shard-*
          path: shard-reports
          merge-multiple: true
      - name: shards covered every test file
        run: ruby scripts/test_shards.rb verify shard-reports/*.json

  # Everything but the Ruby suite, run once.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bundle exec rubocop
      - name: TypeScript smoke test
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Native adapter contract tests
        if: ${{ !cancelled() }}
        run: npm run test:adapters
      - name: site build
        if: ${{ !cancelled() }}
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build

  # rake test, split by scripts/test_shards.rb so the slow browser-capture
  # files sit on different shards. Each shard keeps random order (minitest
  # prints its seed) and warnings, and reports the files it ran and its run
  # count for the ci job to check.
  test:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: rake test
        env:
          TEST_SHARD: ${{ matrix.shard }}/4
        run: |
          set -o pipefail
          bundle exec rake test 2>&1 | tee rake-test.log
      - name: shard report
        if: ${{ !cancelled() }}
        run: ruby scripts/test_shards.rb report "${{ matrix.shard }}/4" rake-test.log "test-shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-shard-${{ matrix.shard }}
          path: test-shard-${{ matrix.shard }}.json
          retention-days: 7

  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          # The Lambda runtime is nodejs22.x, so CI builds and tests on the
          # version the artifact actually runs on rather than the newest one.
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/api/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: vitest
        if: ${{ !cancelled() }}
        run: npm test
      - name: migrations match the schema
        if: ${{ !cancelled() }}
        run: npx drizzle-kit check
      - name: lambda bundle builds
        if: ${{ !cancelled() }}
        run: npm run build

  # The staging SPA. A separate job rather than more steps on `platform`,
  # because the two packages have their own lockfiles and their own npm cache
  # key, and a failing API build should still tell you whether the app compiles.
  #
  # No `paths:` filter, matching every other job here. A filter on `on:` would
  # scope the WHOLE workflow, and per-job path filtering needs a third-party
  # action; either way a required check that silently skips is worse than a job
  # that runs for two minutes on a docs-only PR.
  platform-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          # Nothing pins this build to a runtime the way the API's Lambda does,
          # so it builds on the same Node the rest of the repo's CI uses.
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: vitest
        if: ${{ !cancelled() }}
        run: npm test
      # `npm run build` runs tsc again before vite. Left alone rather than
      # split, so the command CI runs is the command deploy.sh runs.
      - name: app bundle builds
        if: ${{ !cancelled() }}
        run: npm run build
