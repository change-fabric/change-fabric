name: release-image

# Publishes the derived browserless-cf image (docker/browserless-cf) to ghcr
# when a maintainer pushes an image/v* tag. Like the toolkit, the tag is the
# only declaration of the image version, so the guard is monotonicity against
# the image/v* tags already pushed. No workflow ever creates a tag. After a
# publish, a follow-up PR pins the printed digest as the runtime browserless
# image in scripts/change_docker.rb. See RELEASING.md, Image track.

on:
  push:
    tags: ["image/v*"]

# Reading the tree and pushing one container package, nothing else.
permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Every tag: the guard compares this tag against all earlier image/v*.
          fetch-depth: 0
          fetch-tags: true

      - name: The tag must be plain semver, strictly above every earlier one
        id: guard
        env:
          # False when the pushed ref already existed and was force-updated. A
          # published image version never moves: a consumer may have pinned it.
          REF_WAS_CREATED: ${{ github.event.created }}
        run: |
          version="${GITHUB_REF_NAME#image/v}"

          if [ "$REF_WAS_CREATED" != "true" ]; then
            echo "::error title=Tag moved::${GITHUB_REF_NAME} already existed and was force-updated. A published image version never moves. Cut a higher version instead."
            exit 1
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Malformed tag::${GITHUB_REF_NAME} is not image/vMAJOR.MINOR.PATCH. Image releases are plain semver, with no prerelease or build suffix."
            exit 1
          fi

          previous="$(git tag --list 'image/v*' \
            | grep -Fxv "$GITHUB_REF_NAME" \
            | sed 's|^image/v||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)" || true

          if [ -n "$previous" ]; then
            highest="$(printf '%s\n%s\n' "$previous" "$version" \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
            if [ "$version" = "$previous" ] || [ "$highest" != "$version" ]; then
              echo "::error title=Version goes backwards::${GITHUB_REF_NAME} is not above the highest published image release, image/v${previous}. Delete this tag and cut a higher one."
              exit 1
            fi
            echo "${version} is above image/v${previous}"
          else
            echo "no earlier image/v* tag; ${version} is the first image release"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/browserless-cf" >> "$GITHUB_OUTPUT"

      # arm64 hosts (Apple silicon) pull this image too, so build both arches.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/browserless-cf
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.guard.outputs.image }}:${{ steps.guard.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT AND OFL-1.1

      - name: Print the digest to pin
        env:
          IMAGE: ${{ steps.guard.outputs.image }}
          VERSION: ${{ steps.guard.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### browserless-cf ${VERSION}"
            echo
            echo "Pin this in scripts/change_docker.rb (BROWSERLESS_IMAGE) in a follow-up PR:"
            echo
            echo '```'
            echo "${IMAGE}:${VERSION}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
