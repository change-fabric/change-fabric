<div class="cfm cfm-lock" data-cf-view="lock_banner">
<div class="cfm-clock"><div class="cfm-time">{{clock}}</div><div class="cfm-date">{{date}}</div></div>
<button id="banner" class="cfm-banner" type="button" aria-label="{{app}}: {{from}}">
<span class="cfm-head">{{icon}}<span class="cfm-app">{{app}}</span><span>{{time}}</span></span>
<strong class="cfm-from">{{from}}</strong><span class="cfm-preview">{{preview}}</span>
</button>
</div>
