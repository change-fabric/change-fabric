<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compose</title><style>{{css}}</style></head>
<body class="{{device}}">
<main class="window" aria-label="New text message">
<div class="head"><input id="to" aria-label="To" value="{{to}}"><small>Text message</small></div>
<div class="thread"></div>
<div class="composer"><textarea id="body" aria-label="Message">{{body}}</textarea>{{send}}</div>
{{status}}
</main>
<script>{{script}}</script>
</body></html>
