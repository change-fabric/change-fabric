<div class="cfm cfm-thread" data-cf-view="thread">
<div class="cfm-bar"><span class="cfm-avatar">{{initials}}</span><strong>{{from}}</strong></div>
<div class="cfm-msgs" id="thread"><span class="cfm-muted">{{time}}</span><div class="cfm-in">{{body}}</div></div>
<div class="cfm-compose"><textarea id="reply" aria-label="Reply to {{from}}" placeholder="Text message"></textarea><button id="send" class="cfm-send" type="button">Send</button></div>
<div id="status" class="cfm-status" role="status"></div>
</div>
