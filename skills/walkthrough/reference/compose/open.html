<div class="cfm cfm-open" data-cf-view="open">
<div class="cfm-bar">{{icon}}<strong>{{app}}</strong></div>
<article class="cfm-mail">
<h1>{{subject}}</h1>
<div class="cfm-sender"><span class="cfm-avatar">{{initials}}</span><div><strong>{{from}}</strong><span class="cfm-muted">to {{to}}, {{time}}</span></div></div>
<div class="cfm-body">{{body}}</div>
{{cta}}
</article>
</div>
