<div class="cfd-body cfd-elev">
<h2 id="{{id}}-question">Allow this app to make changes to your device?</h2>
<dl><dt>App</dt><dd id="{{id}}-app">{{app}}</dd><dt>Publisher</dt><dd id="{{id}}-publisher">{{publisher}}</dd></dl>
<div class="cfd-actions"><button id="{{id}}-no" class="cfd-btn" type="button" data-cfd-no="{{id}}">No</button><button id="{{id}}-yes" class="cfd-btn cfd-primary" type="button" data-cfd-yes="{{id}}" data-cfd-then="{{then}}">Yes</button></div>
</div>
