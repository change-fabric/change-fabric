<section id="win-{{id}}" class="cfd-win{{focus}}" data-cfd-type="{{type}}" data-cfd-name="{{title}}"{{attrs}} style="left:{{x}}px;top:{{y}}px;width:{{w}}px;height:{{h}}px"{{hidden}} aria-label="{{title}}">
<header class="cfd-bar"><span id="win-{{id}}-title" class="cfd-title">{{title}}</span><button id="win-{{id}}-min" class="cfd-ctl" type="button" data-cfd-min="{{id}}" aria-label="Minimize">&#8722;</button><button id="win-{{id}}-close" class="cfd-ctl" type="button" data-cfd-close="{{id}}" aria-label="Close">&#215;</button></header>
{{body}}
</section>
