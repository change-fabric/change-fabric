#   <sha256> <install path under /usr/share/fonts/truetype/cf/> <url>
# Every URL is pinned to one google/fonts commit, so a changed upstream file
# fails `sha256sum -c` and the build, never silently ships a different font.
# All faces are SIL Open Font License 1.1; each family's OFL.txt is installed
# beside its fonts and recorded in THIRD_PARTY_NOTICES.
