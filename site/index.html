<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="change fabric spec releases"
      href="/changelog.xml"
    />
    <title>change fabric</title>
    <meta
      name="description"
      content="A local-first framework for software quality and release readiness. change fabric runs k6 load, axe-core accessibility, OWASP ZAP, and browserless responsive UX against a locally booted app, driven by one CHANGE.md per repo."
    />
    <meta name="theme-color" content="#f6efe0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#24122a" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="change fabric" />
    <meta property="og:title" content="change fabric" />
    <meta
      property="og:description"
      content="A local-first framework for software quality and release readiness."
    />
    <meta property="og:url" content="https://www.changefabric.org/" />
    <meta property="og:image" content="https://www.changefabric.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The change fabric woven mark and wordmark, with the subtitle A local-first framework for software quality and release readiness."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="change fabric" />
    <meta
      name="twitter:description"
      content="A local-first framework for software quality and release readiness."
    />
    <meta name="twitter:image" content="https://www.changefabric.org/og-image.png" />
    <script>
      // Apply a stored theme choice before first paint to avoid a flash of the
      // wrong theme. No stored choice means follow prefers-color-scheme via CSS.
      (function () {
        try {
          var t = localStorage.getItem("cf-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
