<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="change fabric spec releases"
      href="/changelog.xml"
    />
    <title>change fabric</title>
    <meta
      name="description"
      content="Your coding agent is the harness. Change Fabric extends it: open-source skills and hooks that check each edit against trusted rubrics and gate every change on load, accessibility, security, and responsive checks before it merges, on your own machine."
    />
    <meta name="theme-color" content="#f6efe0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#24122a" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="change fabric" />
    <meta property="og:title" content="change fabric" />
    <meta
      property="og:description"
      content="Your coding agent is the harness. Change Fabric extends it with rubrics on each edit and a local gate before every merge."
    />
    <meta property="og:image" content="https://www.changefabric.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The change fabric woven mark and wordmark, with the subtitle A local-first framework for software quality and release readiness."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="change fabric" />
    <meta
      name="twitter:description"
      content="Your coding agent is the harness. Change Fabric extends it with rubrics on each edit and a local gate before every merge."
    />
    <meta name="twitter:image" content="https://www.changefabric.org/og-image.png" />
    <script>
      // Apply a stored theme choice before first paint to avoid a flash of the
      // wrong theme, browser chrome included. No stored choice means follow prefers-color-scheme via CSS.
      (function () {
        try {
          var t = localStorage.getItem("cf-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
            var c = t === "dark" ? "#24122a" : "#f6efe0";
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
              m.setAttribute("content", c);
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
