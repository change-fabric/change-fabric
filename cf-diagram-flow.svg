<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 392" width="1088" height="392" role="img" aria-labelledby="t d" data-diagram-type="flow">
  <title id="t">How cf:diagram makes a diagram</title>
  <desc id="d">The agent picks a diagram type, sketches nodes and edges, hand-writes the SVG, then lints it with text measured in browserless. A clean lint yields the final SVG. Findings go to fix from hints and back to hand-writing for up to three rounds; findings left after three rounds stop the run with the SVG kept and the findings reported.</desc>
  <style>
    svg { --bg: #F5F5F5; --surface: #FFFFFF; --ink: #2D3142; --muted: #4F5D75; --soft: #5A6580; --line: #4F5D75; --rule: #D9DADD; --accent: #B5401C; --accent-tint: #F2E9E6; --link: #2E5AA8; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #2D3142; --surface: #2D3142; --ink: #F5F5F5; --muted: #BFC0C0; --soft: #A3ACC0; --line: #A3ACC0; --rule: #45495A; --accent: #F08A59; --accent-tint: #3D3844; --link: #7FA9E6; }
    }
    .bg { fill: var(--bg); }
    .node rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .node rect.accent { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    .node rect.chip { fill: none; stroke: var(--soft); stroke-width: 0.8; }
    .node rect.chip.accent { fill: none; stroke: var(--accent); stroke-width: 0.8; }
    .label { fill: var(--ink); font-weight: 600; font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
    .sub { fill: var(--muted); font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .tag { fill: var(--soft); font-weight: 500; font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .tag.accent { fill: var(--accent); }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .edge.accent { stroke: var(--accent); stroke-width: 1.5; }
    .edge.dashed { stroke-dasharray: 5 4; }
    .head { fill: var(--line); }
    .head.accent { fill: var(--accent); }
    .mask { fill: var(--bg); }
    .edge-label { fill: var(--soft); font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .edge-label.accent { fill: var(--accent); }
    .key { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .key.accent { stroke: var(--accent); stroke-width: 1.5; }
    .key.dashed { stroke-dasharray: 5 4; }
    .key { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .key.accent { stroke: var(--accent); stroke-width: 1.5; }
    .key.dashed { stroke-dasharray: 5 4; }
    .rule { stroke: var(--rule); stroke-width: 1; fill: none; }
    .swatch { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .swatch.accent { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 Z" fill="#4F5D75"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head accent" d="M0 0 L10 5 L0 10 Z" fill="#B5401C"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1088" height="392" fill="#F5F5F5"/>

  <path class="edge" data-from="pick" data-to="sketch" d="M192 92 H240" marker-end="url(#arrow)"/>
  <path class="edge" data-from="sketch" data-to="write" d="M408 92 H456" marker-end="url(#arrow)"/>
  <path class="edge" data-from="write" data-to="lint" d="M624 92 H672" marker-end="url(#arrow)"/>
  <path class="edge accent" data-from="lint" data-to="clean" d="M840 92 H888" marker-end="url(#arrow-accent)"/>
  <path class="edge" data-from="lint" data-to="fix" d="M720 136 V216" marker-end="url(#arrow)"/>
  <path class="edge" data-from="lint" data-to="report" d="M800 136 V176 H972 V216" marker-end="url(#arrow)"/>
  <path class="edge dashed" data-from="fix" data-to="write" d="M672 260 H540 V136" marker-end="url(#arrow)"/>
  <rect class="mask" x="840.0" y="68" width="48" height="16" rx="2"/>
  <text id="l-clean" class="edge-label accent" x="864" y="80" font-size="10" text-anchor="middle" letter-spacing="0.06em">CLEAN</text>
  <rect class="mask" x="646.0" y="160" width="68" height="16" rx="2"/>
  <text id="l-findings" class="edge-label" x="680" y="172" font-size="10" text-anchor="middle" letter-spacing="0.06em">FINDINGS</text>
  <rect class="mask" x="836.0" y="148" width="104" height="16" rx="2"/>
  <text id="l-rounds" class="edge-label" x="888" y="160" font-size="10" text-anchor="middle" letter-spacing="0.06em">3 ROUNDS USED</text>
  <rect class="mask" x="584.0" y="236" width="48" height="16" rx="2"/>
  <text id="l-retry" class="edge-label" x="608" y="248" font-size="10" text-anchor="middle" letter-spacing="0.06em">RETRY</text>
  <g class="node" data-id="pick">
    <rect x="24" y="48" width="168" height="88" rx="6"/>
    <rect class="chip" x="36" y="60" width="28" height="16" rx="2"/>
    <text id="pick-tag" class="tag" x="50.0" y="72" font-size="10" text-anchor="middle" letter-spacing="0.08em">01</text>
    <text id="pick-label" class="label" x="108" y="102" font-size="14" text-anchor="middle">Pick type</text>
    <text id="pick-sub" class="sub" x="108" y="120" font-size="11" text-anchor="middle">8 types</text>
  </g>
  <g class="node" data-id="sketch">
    <rect x="240" y="48" width="168" height="88" rx="6"/>
    <rect class="chip" x="252" y="60" width="28" height="16" rx="2"/>
    <text id="sketch-tag" class="tag" x="266.0" y="72" font-size="10" text-anchor="middle" letter-spacing="0.08em">02</text>
    <text id="sketch-label" class="label" x="324" y="102" font-size="14" text-anchor="middle">Sketch nodes</text>
    <text id="sketch-sub" class="sub" x="324" y="120" font-size="11" text-anchor="middle">nodes, edges</text>
  </g>
  <g class="node" data-id="write">
    <rect x="456" y="48" width="168" height="88" rx="6"/>
    <rect class="chip" x="468" y="60" width="28" height="16" rx="2"/>
    <text id="write-tag" class="tag" x="482.0" y="72" font-size="10" text-anchor="middle" letter-spacing="0.08em">03</text>
    <text id="write-label" class="label" x="540" y="102" font-size="14" text-anchor="middle">Hand-write SVG</text>
    <text id="write-sub" class="sub" x="540" y="120" font-size="11" text-anchor="middle">8px grid</text>
  </g>
  <g class="node" data-id="lint">
    <rect x="672" y="48" width="168" height="88" rx="6" class="accent"/>
    <rect class="chip accent" x="684" y="60" width="28" height="16" rx="2"/>
    <text id="lint-tag" class="tag accent" x="698.0" y="72" font-size="10" text-anchor="middle" letter-spacing="0.08em">04</text>
    <text id="lint-label" class="label" x="756" y="102" font-size="14" text-anchor="middle">Lint and measure</text>
    <text id="lint-sub" class="sub" x="756" y="120" font-size="11" text-anchor="middle">browserless</text>
  </g>
  <g class="node" data-id="clean">
    <rect x="888" y="48" width="168" height="88" rx="6"/>
    <rect class="chip" x="900" y="60" width="36" height="16" rx="2"/>
    <text id="clean-tag" class="tag" x="918.0" y="72" font-size="10" text-anchor="middle" letter-spacing="0.08em">OUT</text>
    <text id="clean-label" class="label" x="972" y="102" font-size="14" text-anchor="middle">Clean SVG</text>
    <text id="clean-sub" class="sub" x="972" y="120" font-size="11" text-anchor="middle">diagram.svg</text>
  </g>
  <g class="node" data-id="fix">
    <rect x="672" y="216" width="168" height="88" rx="6"/>
    <rect class="chip" x="684" y="228" width="36" height="16" rx="2"/>
    <text id="fix-tag" class="tag" x="702.0" y="240" font-size="10" text-anchor="middle" letter-spacing="0.08em">FIX</text>
    <text id="fix-label" class="label" x="756" y="270" font-size="14" text-anchor="middle">Fix from hints</text>
    <text id="fix-sub" class="sub" x="756" y="288" font-size="11" text-anchor="middle">one per finding</text>
  </g>
  <g class="node" data-id="report">
    <rect x="888" y="216" width="168" height="88" rx="6"/>
    <rect class="chip" x="900" y="228" width="40" height="16" rx="2"/>
    <text id="report-tag" class="tag" x="920.0" y="240" font-size="10" text-anchor="middle" letter-spacing="0.08em">STOP</text>
    <text id="report-label" class="label" x="972" y="270" font-size="14" text-anchor="middle">Report findings</text>
    <text id="report-sub" class="sub" x="972" y="288" font-size="11" text-anchor="middle">svg kept</text>
  </g>
  <g class="legend">
    <path class="rule" d="M24 336 H1064"/>
    <text id="lg" class="edge-label" x="24" y="364" font-size="10" letter-spacing="0.14em">LEGEND</text>
    <rect class="swatch" x="136" y="352" width="24" height="16" rx="3"/>
    <text id="lg0" class="edge-label" x="172" y="364" font-size="10" letter-spacing="0.06em">STEP</text>
    <rect class="swatch accent" x="312" y="352" width="24" height="16" rx="3"/>
    <text id="lg1" class="edge-label" x="348" y="364" font-size="10" letter-spacing="0.06em">FOCAL STEP</text>
    <path class="key accent" d="M488 360 H512"/>
    <text id="lg2" class="edge-label" x="524" y="364" font-size="10" letter-spacing="0.06em">PRIMARY PATH</text>
    <path class="key dashed" d="M664 360 H688"/>
    <text id="lg3" class="edge-label" x="700" y="364" font-size="10" letter-spacing="0.06em">RETRY LOOP</text>
  </g>
</svg>
