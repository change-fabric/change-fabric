<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 584" width="880" height="584" role="img" aria-labelledby="t d" data-diagram-type="flow">
  <title id="t">How cf:diagram makes a diagram</title>
  <desc id="d">The agent picks a diagram type, sketches nodes and edges, hand-writes the SVG, then lints it with text measured in browserless. No findings yields the clean SVG. Findings with fewer than three fix rounds used go to fix from hints, then back to hand-writing for the next round, where a round is one fix and one re-lint. Findings after three fix rounds stop the run: the SVG is kept and the findings are reported.</desc>
  <style>
    svg { --bg: #F6EFE0; --surface: #F0E8DB; --ink: #24122A; --muted: #574F59; --soft: #574F59; --line: #574F59; --rule: #C1C1B7; --accent: #714C8C; --link: #714C8C; --accent-tint: #E9DFD8; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #24122A; --surface: #2C1B31; --ink: #F6EFE0; --muted: #B8BAB0; --soft: #B8BAB0; --line: #B8BAB0; --rule: #493D4C; --accent: #B690CE; --link: #B690CE; --accent-tint: #382441; }
    }
    .bg { fill: var(--bg); }
    .node rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .node rect.accent { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
    .node rect.chip { fill: none; stroke: var(--soft); stroke-width: 0.8; }
    .node rect.chip.accent { fill: none; stroke: var(--accent); stroke-width: 0.8; }
    .label { fill: var(--ink); font-weight: 600; font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
    .sub { fill: var(--muted); font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .tag { fill: var(--soft); font-weight: 500; font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .tag.accent { fill: var(--accent); }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .edge.accent { stroke: var(--accent); stroke-width: 1.5; }
    .edge.dashed { stroke-dasharray: 5 4; }
    .head { fill: var(--line); }
    .head.accent { fill: var(--accent); }
    .mask { fill: var(--bg); }
    .edge-label { fill: var(--soft); font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; }
    .edge-label.accent { fill: var(--accent); }
    .callout { fill: var(--muted); font-style: italic; font-family: "Instrument Serif", "Iowan Old Style", Georgia, "Noto Serif", "Noto Serif CJK SC", serif; }
    .rule { stroke: var(--rule); stroke-width: 1; fill: none; }
    .key { fill: none; stroke: var(--line); stroke-width: 1.2; }
    .key.accent { stroke: var(--accent); stroke-width: 1.5; }
    .key.dashed { stroke-dasharray: 5 4; }
    .swatch { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .swatch.accent { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0 L10 5 L0 10 Z" fill="#574F59"/></marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head accent" d="M0 0 L10 5 L0 10 Z" fill="#714C8C"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="880" height="584" fill="#F6EFE0"/>

  <path class="edge" data-from="pick" data-to="sketch" d="M216 92 H360" marker-end="url(#arrow)"/>
  <path class="edge" data-from="sketch" data-to="write" d="M528 92 H672" marker-end="url(#arrow)"/>
  <path class="edge" data-from="write" data-to="lint" d="M776 136 V224" marker-end="url(#arrow)"/>
  <path class="edge" data-from="lint" data-to="fix" d="M672 268 H528" marker-end="url(#arrow)"/>
  <path class="edge dashed" data-from="fix" data-to="write" d="M440 224 V176 H712 V136" marker-end="url(#arrow)"/>
  <path class="edge accent" data-from="lint" data-to="clean" d="M752 312 V400" marker-end="url(#arrow-accent)"/>
  <path class="edge" data-from="lint" data-to="report" d="M704 312 V356 H440 V400" marker-end="url(#arrow)"/>
  <rect class="mask" x="542.0" y="228" width="116" height="32" rx="2"/>
  <text id="l-fix" class="edge-label" x="600" y="240" font-size="11" text-anchor="middle" letter-spacing="0.06em"><tspan x="600">FINDINGS</tspan><tspan x="600" dy="16">UNDER 3 FIXES</tspan></text>
  <rect class="mask" x="542.0" y="316" width="116" height="32" rx="2"/>
  <text id="l-report" class="edge-label" x="600" y="328" font-size="11" text-anchor="middle" letter-spacing="0.06em"><tspan x="600">FINDINGS</tspan><tspan x="600" dy="16">AFTER 3 FIXES</tspan></text>
  <rect class="mask" x="758.0" y="348" width="100" height="16" rx="2"/>
  <text id="l-clean" class="edge-label accent" x="808" y="360" font-size="11" text-anchor="middle" letter-spacing="0.06em">NO FINDINGS</text>
  <rect class="mask" x="530.0" y="152" width="92" height="16" rx="2"/>
  <text id="l-next" class="edge-label" x="576" y="164" font-size="11" text-anchor="middle" letter-spacing="0.06em">NEXT ROUND</text>
  <text id="callout" class="callout" x="48" y="252" font-size="15"><tspan x="48">A round is one fix</tspan><tspan x="48" dy="20">and one re-lint.</tspan><tspan x="48" dy="20">Three rounds at most.</tspan></text>
  <g class="node" data-id="pick">
    <rect x="48" y="48" width="168" height="88" rx="6"/>
    <rect class="chip" x="60" y="60" width="32" height="18" rx="2"/>
    <text id="pick-tag" class="tag" x="76.0" y="74" font-size="11" text-anchor="middle" letter-spacing="0.08em">01</text>
    <text id="pick-label" class="label" x="132" y="102" font-size="14" text-anchor="middle">Pick type</text>
    <text id="pick-sub" class="sub" x="132" y="120" font-size="12" text-anchor="middle">8 types</text>
  </g>
  <g class="node" data-id="sketch">
    <rect x="360" y="48" width="168" height="88" rx="6"/>
    <rect class="chip" x="372" y="60" width="32" height="18" rx="2"/>
    <text id="sketch-tag" class="tag" x="388.0" y="74" font-size="11" text-anchor="middle" letter-spacing="0.08em">02</text>
    <text id="sketch-label" class="label" x="444" y="102" font-size="14" text-anchor="middle">Sketch nodes</text>
    <text id="sketch-sub" class="sub" x="444" y="120" font-size="12" text-anchor="middle">nodes, edges</text>
  </g>
  <g class="node" data-id="write">
    <rect x="672" y="48" width="168" height="88" rx="6"/>
    <rect class="chip" x="684" y="60" width="32" height="18" rx="2"/>
    <text id="write-tag" class="tag" x="700.0" y="74" font-size="11" text-anchor="middle" letter-spacing="0.08em">03</text>
    <text id="write-label" class="label" x="756" y="102" font-size="14" text-anchor="middle">Hand-write SVG</text>
    <text id="write-sub" class="sub" x="756" y="120" font-size="12" text-anchor="middle">8px grid</text>
  </g>
  <g class="node" data-id="lint">
    <rect x="672" y="224" width="168" height="88" rx="6" class="accent"/>
    <rect class="chip accent" x="684" y="236" width="32" height="18" rx="2"/>
    <text id="lint-tag" class="tag accent" x="700.0" y="250" font-size="11" text-anchor="middle" letter-spacing="0.08em">04</text>
    <text id="lint-label" class="label" x="756" y="278" font-size="14" text-anchor="middle">Lint and measure</text>
    <text id="lint-sub" class="sub" x="756" y="296" font-size="12" text-anchor="middle">browserless</text>
  </g>
  <g class="node" data-id="fix">
    <rect x="360" y="224" width="168" height="88" rx="6"/>
    <rect class="chip" x="372" y="236" width="40" height="18" rx="2"/>
    <text id="fix-tag" class="tag" x="392.0" y="250" font-size="11" text-anchor="middle" letter-spacing="0.08em">FIX</text>
    <text id="fix-label" class="label" x="444" y="278" font-size="14" text-anchor="middle">Fix from hints</text>
    <text id="fix-sub" class="sub" x="444" y="296" font-size="12" text-anchor="middle">one per finding</text>
  </g>
  <g class="node" data-id="clean">
    <rect x="672" y="400" width="168" height="88" rx="6"/>
    <rect class="chip" x="684" y="412" width="40" height="18" rx="2"/>
    <text id="clean-tag" class="tag" x="704.0" y="426" font-size="11" text-anchor="middle" letter-spacing="0.08em">OUT</text>
    <text id="clean-label" class="label" x="756" y="454" font-size="14" text-anchor="middle">Clean SVG</text>
    <text id="clean-sub" class="sub" x="756" y="472" font-size="12" text-anchor="middle">diagram.svg</text>
  </g>
  <g class="node" data-id="report">
    <rect x="360" y="400" width="168" height="88" rx="6"/>
    <rect class="chip" x="372" y="412" width="48" height="18" rx="2"/>
    <text id="report-tag" class="tag" x="396.0" y="426" font-size="11" text-anchor="middle" letter-spacing="0.08em">STOP</text>
    <text id="report-label" class="label" x="444" y="454" font-size="14" text-anchor="middle">Report findings</text>
    <text id="report-sub" class="sub" x="444" y="472" font-size="12" text-anchor="middle">svg kept</text>
  </g>
  <g class="legend">
    <path class="rule" d="M48 520 H840"/>
    <text id="lg" class="edge-label" x="48" y="552" font-size="11" letter-spacing="0.14em">LEGEND</text>
    <rect class="swatch" x="160" y="540" width="24" height="16" rx="3"/>
    <text id="lg0" class="edge-label" x="196" y="552" font-size="11" letter-spacing="0.06em">STEP</text>
    <rect class="swatch accent" x="320" y="540" width="24" height="16" rx="3"/>
    <text id="lg1" class="edge-label" x="356" y="552" font-size="11" letter-spacing="0.06em">FOCAL STEP</text>
    <path class="key accent" d="M504 548 H528"/>
    <text id="lg2" class="edge-label" x="540" y="552" font-size="11" letter-spacing="0.06em">CLEAN RESULT</text>
    <path class="key dashed" d="M664 548 H688"/>
    <text id="lg3" class="edge-label" x="700" y="552" font-size="11" letter-spacing="0.06em">FIX LOOP</text>
  </g>
</svg>
