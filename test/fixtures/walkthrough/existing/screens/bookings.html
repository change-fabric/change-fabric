<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Harborline: your tickets</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body { margin: 0; background: var(--bg); color: var(--text); font: var(--size-body)/1.5 var(--font); }
    header { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-4); background: var(--accent); color: var(--accent-text); }
    main { max-width: 720px; margin: var(--space-4) auto; }
    h1 { font-size: var(--size-title); margin: 0 0 var(--space-3); }
    ul { list-style: none; margin: 0; padding: 0; }
    .ticket { padding: var(--space-3); margin-bottom: var(--space-2); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .meta { color: var(--muted); }
  </style>
</head>
<body>
  <header><img src="assets/harborline.svg" alt="" width="48" height="48"><strong>Harborline</strong></header>
  <main>
    <h1>Your tickets (<span data-cf-count="bookings"></span>)</h1>
    <p data-cf-empty="bookings">No tickets yet.</p>
    <ul>
      <template data-cf-list="bookings">
        <li class="ticket"><div data-cf-field="route"></div><div class="meta" data-cf-field="time"></div></li>
      </template>
    </ul>
  </main>
  <script src="mock-store.js"></script>
</body>
</html>
