<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage</title>
<style>
  :root { --font-sans: "Inter", system-ui, sans-serif; --font-serif: "Source Serif 4", Georgia, serif; }
  html, body { margin: 0; height: 100%; background: #0f172a; color: #f1f5f9; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 64px; }
  h1 { margin: 0; font-family: var(--font-serif); font-size: 96px; font-weight: 600; text-align: center; max-width: 1500px; }
  button { font-family: var(--font-sans); font-size: 40px; padding: 20px 56px; border: 0; border-radius: 16px; background: #38bdf8; color: #0f172a; }
</style>
</head>
<body>
  <main>
    <h1 id="statement">Every change starts as a plan</h1>
    <button id="ship" type="button">Ship</button>
  </main>
  <script>
    // Reports every visible text box for the free clip check (boxes.json).
    window.__cfBoxes = () => [ ...document.querySelectorAll('#statement, #ship') ].map((n) => {
      const r = n.getBoundingClientRect();
      return { id: n.id, kind: 'text', text: n.textContent, font_px: parseFloat(getComputedStyle(n).fontSize),
               overflow: n.scrollWidth > n.clientWidth + 1, x: r.x, y: r.y, w: r.width, h: r.height };
    });
  </script>
</body>
</html>
