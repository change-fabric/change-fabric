<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shelfwise: open loans</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    body { margin: 0; background: var(--bg); color: var(--text); font: var(--size-body)/1.5 var(--font); }
    main { max-width: 820px; margin: var(--space-4) auto; padding: var(--space-3); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    h1 { font-size: var(--size-title); margin: 0 0 var(--space-3); }
    .count { color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; }
    .row { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: var(--space-2); padding: var(--space-2) 0; border-top: 1px solid var(--border); }
    .row:hover { background: var(--bg); }
    .due { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Open loans <span class="count">(<span data-cf-count="loans"></span>)</span></h1>
    <p data-cf-empty="loans">No books are out.</p>
    <ul id="loans">
      <template data-cf-list="loans">
        <li class="row"><span data-cf-field="borrower"></span><span data-cf-field="title"></span><span class="due" data-cf-field="due"></span></li>
      </template>
    </ul>
  </main>
  <script src="mock-store.js"></script>
</body>
</html>
