# Class 1 upgraded for suite v6: the scroll position before leaving and after
# coming back are two named reads, and the relation says they are equal within
# a few pixels.
suite: measured-relation-scroll
suite_version: 6
cases:
  - id: list-scroll-restores
    acceptance: Coming back to the list restores the scroll position.
    steps:
      - goto: /items
      - eval: { script: "window.scrollTo(0, 1200); return window.scrollY;" }
      - capture: { var: y_before, kind: scroll_y }
      - click: "#open"
      - wait_for_network_idle: { idle_ms: 500 }
      - capture: { var: y_after, kind: scroll_y }
      - expect_relation: { relation: equal, reads: { a: y_before, b: y_after }, tolerance: 4 }
