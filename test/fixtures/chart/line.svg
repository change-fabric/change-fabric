<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 472" width="880" height="472" role="img" aria-labelledby="t d" data-chart-type="line">
  <title id="t">Roast score by round</title>
  <desc id="d">Both scores climb every round; the plan reaches 9 by round 3.</desc>
  <style>
    svg { --bg: #F5F5F5; --surface: #FFFFFF; --ink: #2D3142; --muted: #4F5D75; --soft: #5A6580; --line: #4F5D75; --rule: #D9DADD; --accent: #B5401C; --accent-tint: #F2E9E6; --link: #2E5AA8; --s1: #B5401C; --s2: #2E5AA8; --s3: #2D3142; --s4: #724D62; --s5: #D2917E; --s6: #88A0CB; --ramp-1: #E8D1CA; --ramp-2: #DBAD9E; --ramp-3: #CF8873; --ramp-4: #C26447; --ramp-5: #B5401C; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #2D3142; --surface: #2D3142; --ink: #F5F5F5; --muted: #BFC0C0; --soft: #A3ACC0; --line: #A3ACC0; --rule: #45495A; --accent: #F08A59; --accent-tint: #3D3844; --link: #7FA9E6; --s1: #F08A59; --s2: #7FA9E6; --s3: #F5F5F5; --s4: #B89AA0; --s5: #98624F; --s6: #5A739C; --ramp-1: #544347; --ramp-2: #7B554B; --ramp-3: #A26650; --ramp-4: #C97854; --ramp-5: #F08A59; }
    }
    .bg { fill: var(--bg); }
    text { font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
    .chart-title { fill: var(--ink); font-weight: 600; }
    .axis-title { fill: var(--soft); }
    .tick-label, .legend-label { fill: var(--muted); }
    .cell { fill: var(--ink); }
    .header { fill: var(--ink); font-weight: 600; }
    .tick { stroke: var(--rule); stroke-width: 1; }
    .baseline { stroke: var(--ink); stroke-width: 1; }
    .rule-line { stroke: var(--rule); stroke-width: 1; }
    .mark-line { fill: none; stroke-width: 2; }
    .marks rect { stroke: var(--bg); stroke-width: 1; }
    .s1 { fill: var(--s1); } .line-s1 { stroke: var(--s1); }
      .s2 { fill: var(--s2); } .line-s2 { stroke: var(--s2); }
      .s3 { fill: var(--s3); } .line-s3 { stroke: var(--s3); }
      .s4 { fill: var(--s4); } .line-s4 { stroke: var(--s4); }
      .s5 { fill: var(--s5); } .line-s5 { stroke: var(--s5); }
      .s6 { fill: var(--s6); } .line-s6 { stroke: var(--s6); }
    .ramp-1 { fill: var(--ramp-1); }
      .ramp-2 { fill: var(--ramp-2); }
      .ramp-3 { fill: var(--ramp-3); }
      .ramp-4 { fill: var(--ramp-4); }
      .ramp-5 { fill: var(--ramp-5); }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="472" fill="#F5F5F5"/>
  <text class="chart-title" x="32" y="44" font-size="18">Roast score by round</text>
  <g class="axis" data-axis="y" data-role="value-y" data-scale="linear" data-label="Score" data-unit="of 10" data-min="5" data-max="9">
    <line class="tick" data-value="5" x1="47.2" y1="368" x2="832" y2="368"/>
    <text class="tick-label" x="39.2" y="372" font-size="12" text-anchor="end">5</text>
    <line class="tick" data-value="6" x1="47.2" y1="298" x2="832" y2="298"/>
    <text class="tick-label" x="39.2" y="302" font-size="12" text-anchor="end">6</text>
    <line class="tick" data-value="7" x1="47.2" y1="228" x2="832" y2="228"/>
    <text class="tick-label" x="39.2" y="232" font-size="12" text-anchor="end">7</text>
    <line class="tick" data-value="8" x1="47.2" y1="158" x2="832" y2="158"/>
    <text class="tick-label" x="39.2" y="162" font-size="12" text-anchor="end">8</text>
    <line class="tick" data-value="9" x1="47.2" y1="88" x2="832" y2="88"/>
    <text class="tick-label" x="39.2" y="92" font-size="12" text-anchor="end">9</text>
    <text class="axis-title" x="32" y="72" font-size="12">Score (of 10)</text>
  </g>
  <g class="axis" data-axis="x" data-role="category" data-scale="band" data-label="Round" data-unit="">
    <text class="tick-label" x="178" y="388" font-size="12" text-anchor="middle">1</text>
    <text class="tick-label" x="439.6" y="388" font-size="12" text-anchor="middle">2</text>
    <text class="tick-label" x="701.2" y="388" font-size="12" text-anchor="middle">3</text>
    <text class="axis-title" x="439.6" y="412" font-size="12" text-anchor="middle">Round</text>
  </g>
  <g class="marks">
    <path class="mark-line line-s1" data-series="plan" data-key="line" d="M178 263 L439.6 158 L701.2 88"/>
    <circle class="mark s1" data-series="plan" data-key="1" data-value="6.5" cx="178" cy="263" r="3"/>
    <circle class="mark s1" data-series="plan" data-key="2" data-value="8" cx="439.6" cy="158" r="3"/>
    <circle class="mark s1" data-series="plan" data-key="3" data-value="9" cx="701.2" cy="88" r="3"/>
    <path class="mark-line line-s2" data-series="visuals" data-key="line" d="M178 368 L439.6 193 L701.2 123"/>
    <circle class="mark s2" data-series="visuals" data-key="1" data-value="5" cx="178" cy="368" r="3"/>
    <circle class="mark s2" data-series="visuals" data-key="2" data-value="7.5" cx="439.6" cy="193" r="3"/>
    <circle class="mark s2" data-series="visuals" data-key="3" data-value="8.5" cx="701.2" cy="123" r="3"/>
  </g>
  <g class="legend">
    <rect class="swatch s1" data-series="plan" x="47.2" y="432" width="12" height="12"/>
    <text class="legend-label" data-series="plan" x="65.2" y="442" font-size="12">plan</text>
    <rect class="swatch s2" data-series="visuals" x="118" y="432" width="12" height="12"/>
    <text class="legend-label" data-series="visuals" x="136" y="442" font-size="12">visuals</text>
  </g>
  <g data-role="data-table" aria-label="Data table">
    <desc>plan, 1: 6.5</desc>
    <desc>plan, 2: 8</desc>
    <desc>plan, 3: 9</desc>
    <desc>visuals, 1: 5</desc>
    <desc>visuals, 2: 7.5</desc>
    <desc>visuals, 3: 8.5</desc>
  </g>
</svg>
