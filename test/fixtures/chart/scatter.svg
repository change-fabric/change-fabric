    <circle class="mark s1" data-series="merged" data-key="1" data-value="120,2" cx="209.92" cy="312" r="4"/>
    <circle class="mark s1" data-series="merged" data-key="2" data-value="260,4" cx="391.36" cy="256" r="4"/>
