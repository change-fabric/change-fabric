    <text class="legend-label" data-series="merged" x="72.4" y="442" font-size="12">merged</text>
    <rect class="swatch s2" data-series="reverted" x="139.6" y="432" width="12" height="12"/>
    <text class="legend-label" data-series="reverted" x="157.6" y="442" font-size="12">reverted</text>
  </g>
  <g data-role="data-table" aria-label="Data table">
    <desc>merged: 40, 1</desc>
    <desc>merged: 120, 2</desc>
    <desc>merged: 260, 4</desc>
    <desc>merged: 400, 5</desc>
