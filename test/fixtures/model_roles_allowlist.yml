- key: e9db255e73ef2e63febcc2b84f2a3ac8829c45454d7b44f90b82209745a9e2fb
  path: skills/README.md
  line: "| `cf:plan` | Researches a goal with background Opus agents, grills the user
    with AskUserQuestion until the judgment calls are settled, then lands a plan.md,
    a 4000-character-capped goal.md, and a runnable workflow.js under `$CF_PLANS_ROOT`
    (default `~/.claude/cf/plans`), plus a handoff prompt for a separate session to
    execute. |"
- key: d7fe9202e56fdb9ba6c02a4b4b9bc70a7661b89a6efcfa760ea28d1a62f0fbad
  path: skills/brainstorm/SKILL.md
  line: '3. **Diverge.** Render `reference/lens-prompt.md` once per lens (`{{framing}}`,
    `{{lens_name}}`, `{{lens_brief}}`). Launch four background Opus agents with the
    Agent tool, all four in a single message so they run in parallel: user-value,
    simplest-thing, risk-and-ops, and the topic lens. They are read-only researchers:
    they may read the repo for grounding but write nothing. Never send them as separate
    messages.'
- key: ebb51d50670dfc9f57e791a477d18e17b48db0ef8e1395019d15397e21b74959
  path: skills/brainstorm/SKILL.md
  line: 'description: Divergent step that runs before cf:plan and feeds it. Frames
    the problem in at most five sentences, launches four background Opus agents in
    one message to generate options from three fixed lenses (user-value, simplest-thing,
    risk-and-ops) plus one topic lens chosen at framing, clusters the options into
    named concepts, culls a shortlist with one cf:roast doc round under a 0.5 USD
    cap, and lets the user pick with AskUserQuestion. Lands brainstorm.md in the plan
    dir and prints a paste-ready cf:plan line with --seed. It never writes plan.md,
    goal.md, or workflow.js and never invokes cf:plan itself.'
