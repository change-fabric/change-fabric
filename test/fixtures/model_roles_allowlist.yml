- key: e08fad21d24de7147e12d8d7348397eecb3939c9fc14847418b4df39f74948b3
  path: skills/roast/SKILL.md
  line: 'A lens is the body of a cf rubric skill (for example cf:terraform, cf:aws,
    cf:refactoring) added to the critic prompt as an extra rubric. cf:simplicity,
    the anti-over-engineering rubric, is a lens only: it has no `auto:` block, so
    the path router never suggests it and it applies only when named with `--lens
    cf:simplicity`. `--lens NAME` (repeatable) takes `aws` or `cf:aws`. Ruby routes,
    a haiku agent culls:'
- key: f92fd79b66fa4fed4ef9a0cde9163a1ea6b6fd846619a4aa9d700071922f4b41
  path: skills/walkthrough/reference/storyboard-schema.md
  line: Live capture runs open-source Chromium, which cannot decode H.264 video or
    AAC audio. A `<video>` or `<audio>` it cannot play is reported by the UX lint
    as `unplayable-media` and blocks `--final`; serve a VP9/Opus or AV1 transcode
    at the same path for filming.
