  line: 2. If candidates exist and the user named no lens, run one Agent (subagent_type
    general-purpose, model haiku, foreground). Give it the input file paths and each
    candidate's `~/.claude/skills/cf:NAME/SKILL.md`. Ask for a JSON list of the candidates
