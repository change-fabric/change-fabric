  path: skills/walkthrough/reference/storyboard-schema.md
  line: Live capture runs open-source Chromium, which cannot decode H.264 video or
    AAC audio. A `<video>` or `<audio>` it cannot play is reported by the UX lint
    as `unplayable-media` and blocks `--final`; serve a VP9/Opus or AV1 transcode
    at the same path for filming.
