<!doctype html><html><head><meta charset="utf-8"><title>Dashboard</title></head>
<body style="margin:0"><div id="slot"></div><main><h1>Dashboard</h1></main>
<script>setTimeout(() => { const b = document.createElement('div'); b.style.height = '20px'; b.id = 'b'; document.getElementById('slot').append(b); }, 250); setTimeout(() => { document.getElementById('b').remove(); }, 700);</script></body></html>
