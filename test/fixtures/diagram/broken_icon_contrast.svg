<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="t d" data-diagram-type="architecture" data-provider="aws">
  <title id="t">Broken: cloud chip has no surface plate</title>
  <desc id="d">Inside the cloud, a VPC holds a private subnet. An orders API calls a worker function, which writes order records to a database. Icons come from a synthetic test pack.</desc>
  <style>
    svg { --bg: #FFFFFF; --surface: #FFFFFF; --ink: #2D3142; --muted: #4F5D75; --soft: #5A6580; --line: #4F5D75; --rule: #D9DADD; --accent: #B5401C; --accent-tint: #F2E9E6; --link: #2E5AA8; --aws-cloud: #242F3E; --aws-vpc: #8C4FFF; --aws-private-subnet: #00A4A6; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #2D3142; --surface: #2D3142; --ink: #F5F5F5; --muted: #BFC0C0; --soft: #A3ACC0; --line: #A3ACC0; --rule: #45495A; --accent: #F08A59; --accent-tint: #3D3844; --link: #7FA9E6; --aws-cloud: #777E87; --aws-vpc: #9258FF; --aws-private-subnet: #00A4A6; }
    }
    .bg { fill: var(--bg); }
    .node > rect { fill: var(--surface); stroke: var(--ink); stroke-width: 1; }
    .label { fill: var(--ink); font-weight: 600; font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.2; }
    #arrow path { fill: var(--line); }
    .group > rect { fill: none; stroke-width: 1.5; }
    .group-label { fill: var(--ink); font-weight: 600; font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans CJK SC", "Noto Sans CJK JP", sans-serif; }
  </style>
